# Teste temporário: o GitHub consegue baixar o SINAPI do site da Caixa?
name: Sonda SINAPI (temporário)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for p in sinapi-relatorios-mensais sinapi-a-partir-jul-2009 sinapi-a-partir-jan-2025; do
            u="https://www.caixa.gov.br/Downloads/$p/SINAPI-2026-09-formato-xlsx.zip"
            rm -f cj.txt saida.bin
            r=$(curl -s -L -m 120 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -c cj.txt -b cj.txt -o saida.bin -w "%{http_code} %{content_type} %{size_download} %{num_redirects}" "$u")
            echo "$p => $r $(file -b saida.bin | cut -c1-60)"
          done
          curl -s -L -m 60 -A "Mozilla/5.0" -c cj.txt -b cj.txt "https://www.caixa.gov.br/poder-publico/modernizacao-gestao/sinapi/Paginas/default.aspx" -o pag.html -w "pagina %{http_code} %{size_download}\n"
          grep -oiE '[^"'"'"' ]*(formato-xlsx|Downloads/sinapi)[^"'"'"' <]*' pag.html | sort -u | head -20
